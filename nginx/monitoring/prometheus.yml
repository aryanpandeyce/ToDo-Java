global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'todo-backend-cluster'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'backend-1:8080'
          - 'backend-2:8080'
          - 'backend-3:8080'
        labels:
          service: 'todo-backend'
          environment: 'production'

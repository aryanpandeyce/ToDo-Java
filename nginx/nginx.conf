worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------------------------
    # 7. SECURITY: Hide Nginx version token in headers and error pages
    # ----------------------------------------------------------------------
    server_tokens off;

    # Custom log format with upstream timing and replica tracking
    log_format traffic_log '$remote_addr - [$time_local] "$request" '
                           'status=$status body_bytes=$body_bytes_sent '
                           'upstream=$upstream_addr '
                           'upstream_status=$upstream_status '
                           'req_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log traffic_log;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ----------------------------------------------------------------------
    # 6. CACHING & COMPRESSION: Gzip compression for API JSON & static assets
    # ----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ----------------------------------------------------------------------
    # 3. RATE LIMITING: Token bucket / leaky bucket per client IP on /api
    #    10 requests/second per IP (10MB shared memory zone ~160,000 IPs)
    # ----------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;
    limit_req_status 429;

    # ----------------------------------------------------------------------
    # 4. CONNECTION LIMITING: Max concurrent active connections per IP
    # ----------------------------------------------------------------------
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;
    limit_conn_status 429;

    # ----------------------------------------------------------------------
    # 1 & 2. LOAD BALANCING & PASSIVE HEALTH CHECKS / FAILOVER
    #        least_conn routing across 3 Spring Boot backend replicas
    # ----------------------------------------------------------------------
    upstream todo_backend_cluster {
        least_conn;

        server backend-1:8080 max_fails=2 fail_timeout=10s;
        server backend-2:8080 max_fails=2 fail_timeout=10s;
        server backend-3:8080 max_fails=2 fail_timeout=10s;

        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ------------------------------------------------------------------
        # 5. TIMEOUTS & BUFFERS: Request size limit and proxy buffer tuning
        # ------------------------------------------------------------------
        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;

        # ------------------------------------------------------------------
        # 7. SECURITY HEADERS: Hardened HTTP response headers
        # ------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self';" always;

        # Custom 429 Error Page (JSON for API clients, HTML fallback)
        error_page 429 /429.json;
        location = /429.json {
            internal;
            default_type application/json;
            add_header Retry-After 5 always;
            add_header X-Rate-Limited-By "nginx-edge-gateway" always;
            return 429 '{"status":429,"error":"Too Many Requests (Nginx Edge)","message":"Edge rate limit or connection limit exceeded. Please slow down and retry shortly.","retryAfterSeconds":5,"servedBy":"nginx-edge-gateway"}';
        }

        location = /429.html {
            internal;
            root /usr/share/nginx/html;
        }

        # ------------------------------------------------------------------
        # 8. SINGLE ENTRY POINT: Proxy /api/* to Spring Boot Upstream Cluster
        # ------------------------------------------------------------------
        location /api/ {
            # Enforce edge rate limit: 10 req/sec with burst of 15 (nodelay)
            limit_req zone=api_rate_limit burst=15 nodelay;

            # Enforce max 20 concurrent connections per IP
            limit_conn addr_conn_limit 20;

            # CORS Configuration
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 3600 always;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'X-Served-By, X-Rate-Limit-Remaining, Retry-After' always;

            # Proxy pass to load-balanced upstream
            proxy_pass http://todo_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward client identity headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 2. Automatic Failover to next healthy replica on error/timeout/5xx
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 6s;

            # 5. Upstream Timeouts and Buffers
            proxy_connect_timeout 2s;
            proxy_send_timeout    5s;
            proxy_read_timeout    5s;
            proxy_buffering       on;
            proxy_buffer_size     8k;
            proxy_buffers         8 16k;
            proxy_busy_buffers_size 32k;
        }

        # Expose read-only actuator health via gateway for quick diagnostics
        location = /api/health {
            proxy_pass http://todo_backend_cluster/actuator/health;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        # ------------------------------------------------------------------
        # 6. STATIC ASSET CACHING: Aggressive caching for hashed Vite bundles
        # ------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            try_files $uri =404;
        }

        # ------------------------------------------------------------------
        # 8. REACT SPA SERVING: Serve index.html on / and client-side routes
        # ------------------------------------------------------------------
        location / {
            limit_conn addr_conn_limit 30;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}


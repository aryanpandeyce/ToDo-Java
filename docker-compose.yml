x-backend-template: &backend-template
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    DB_HOST: postgres
    DB_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-tododb}
    POSTGRES_USER: ${POSTGRES_USER:-todouser}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todopass_secret_change_me}
    APP_RATELIMIT_WRITE_PER_MINUTE: ${APP_RATELIMIT_WRITE_PER_MINUTE:-20}
  expose:
    - "8080"
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 25s
  networks:
    - backend-net

services:
  # ------------------------------------------------------------------------
  # DATABASE: PostgreSQL 16 (Internal network only - no host port exposed)
  # ------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tododb}
      POSTGRES_USER: ${POSTGRES_USER:-todouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todopass_secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todouser} -d ${POSTGRES_DB:-tododb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # ------------------------------------------------------------------------
  # BACKEND REPLICAS (3 instances for least_conn Load Balancing & Failover)
  # Internal only - only accessible via Nginx gateway
  # ------------------------------------------------------------------------
  backend-1:
    <<: *backend-template
    container_name: todo-backend-1
    hostname: backend-1
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      HOSTNAME: backend-1
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tododb}
      POSTGRES_USER: ${POSTGRES_USER:-todouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todopass_secret_change_me}
      APP_RATELIMIT_WRITE_PER_MINUTE: ${APP_RATELIMIT_WRITE_PER_MINUTE:-20}

  backend-2:
    <<: *backend-template
    container_name: todo-backend-2
    hostname: backend-2
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      HOSTNAME: backend-2
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tododb}
      POSTGRES_USER: ${POSTGRES_USER:-todouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todopass_secret_change_me}
      APP_RATELIMIT_WRITE_PER_MINUTE: ${APP_RATELIMIT_WRITE_PER_MINUTE:-20}

  backend-3:
    <<: *backend-template
    container_name: todo-backend-3
    hostname: backend-3
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      HOSTNAME: backend-3
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tododb}
      POSTGRES_USER: ${POSTGRES_USER:-todouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todopass_secret_change_me}
      APP_RATELIMIT_WRITE_PER_MINUTE: ${APP_RATELIMIT_WRITE_PER_MINUTE:-20}

  # ------------------------------------------------------------------------
  # SINGLE ENTRY POINT: Nginx Reverse Proxy + React Static Build (Port 80)
  # ------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: todo-nginx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend-net

  # ------------------------------------------------------------------------
  # MONITORING: Prometheus & Grafana (Scraping /actuator/prometheus)
  # ------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: todo-prometheus
    restart: unless-stopped
    volumes:
      - ./nginx/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: todo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./nginx/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./nginx/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:


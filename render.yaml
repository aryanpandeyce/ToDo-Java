services:
  - type: web
    name: lattech-todo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      # Uses embedded PostgreSQL-mode H2 by default so Render deploys cleanly even when your
      # Render account already has an active free-tier Postgres DB.
      # To connect your existing Postgres DB instead, replace these 3 values in the Render dashboard:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:tododb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - key: SPRING_DATASOURCE_DRIVER
        value: org.h2.Driver
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        value: https://aryanpandeyce.github.io,http://localhost,http://localhost:5173
      - key: APP_RATELIMIT_WRITE_PER_MINUTE
        value: 20

databases:
  - name: lattech-postgres
    databaseName: tododb
    user: todouser
    plan: free

services:
  - type: web
    name: lattech-todo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: lattech-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: lattech-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: lattech-postgres
          property: database
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lattech-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lattech-postgres
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: https://aryanpandeyce.github.io,http://localhost,http://localhost:5173
      - key: APP_RATELIMIT_WRITE_PER_MINUTE
        value: 20


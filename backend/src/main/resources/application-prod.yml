spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:tododb}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:todouser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:todopass_secret_change_me}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 2500
      validation-timeout: 1500
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: INFO
    com.example.todo: INFO


spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:tododb}
    username: ${POSTGRES_USER:todouser}
    password: ${POSTGRES_PASSWORD:todopass_secret_change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.example.todo: DEBUG
    org.springframework.web: INFO


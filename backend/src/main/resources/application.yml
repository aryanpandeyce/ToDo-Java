server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: lattech-todo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      company: Lattech
      instance: ${HOSTNAME:local-instance}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: Lattech Todo
    company: Lattech
    description: Lattech Todo - High Availability & Traffic Management Platform
    version: 1.0.0

resilience4j:
  circuitbreaker:
    instances:
      todoDb:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 2s
  timelimiter:
    instances:
      todoDb:
        timeoutDuration: 3s
        cancelRunningFuture: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://aryanpandeyce.github.io,http://localhost,http://localhost:5173}
  ratelimit:
    write-per-minute: ${APP_RATELIMIT_WRITE_PER_MINUTE:20}
  instance-id: ${RENDER_INSTANCE_ID:${HOSTNAME:backend-local}}

